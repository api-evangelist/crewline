name: Crewline
description: 'Crewline is an autonomous heavy-equipment company that retrofits existing construction
  machinery to operate self-driving. Its hardware retrofit kit installs on-site in about an hour and
  adds autonomy to drum rollers today (compatible with Caterpillar, Bomag, Hamm, Volvo, and CASE), with
  dozers on the 2027 roadmap and rock trucks, excavators, motor graders, and wheel loaders in
  development. It is offered on a subscription model with zero upfront cost, a fixed monthly rate per
  machine, and 24/7 technical support, targeting earthworks and grading crews. Crewline is backed by
  Initialized Capital and headquartered in San Francisco. It publishes no public API or developer
  program at this time.'
